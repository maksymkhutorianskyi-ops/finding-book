<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finding — завантаження</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:42rem;margin:12vh auto;padding:1rem;color:#222;background:#fafafa}
.box{padding:1.25rem;border:1px solid #ddd;border-radius:12px;background:#fff}
</style>
</head>
<body>
<div class="box" id="status">Завантаження інтерактивної книги…</div>
<script>
(async()=>{
  const EXPECTED='371a45a0aeac0163bb23a1e901e6c955fe91a24963f52a07f59013b8e00e3179';
  const N=48;
  try{
    if(!('DecompressionStream' in window)) throw new Error('Цей браузер не підтримує потрібне розпакування. Оновіть браузер.');
    const urls=Array.from({length:N},(_,i)=>`payload/p${String(i).padStart(2,'0')}.txt`);
    const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error(`Не вдалося завантажити ${u}`);return r.text();}));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const packed=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)packed[i]=bin.charCodeAt(i);
    const raw=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));
    const hex=[...digest].map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hex!==EXPECTED) throw new Error('Перевірка цілісності книги не пройдена.');
    const html=new TextDecoder().decode(raw);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('status').textContent='Не вдалося відкрити книгу: '+e.message;console.error(e);}
})();
</script>
</body>
</html>
